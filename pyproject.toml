[project]
name = "autotramita"
version = "0.0.0"
description = "AutoTramita.es backend (modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "fastapi>=0.165.0,<1.0.0",
    "httpx>=0.28.1,<1",
    "opentelemetry-api>=1.45.2,<2.0.0",
    "opentelemetry-sdk>=1.45.2,<2.0.0",
    "psycopg[binary]>=3.3.9,<4.0.0",
    "pydantic>=2.14.4,<3.0.0",
    "pydantic-settings>=2.16.3,<3.0.0",
    "pyjwt[crypto]>=2.10,<3",
    "redis>=8.2.0,<9.0.0",
    "sqlalchemy>=2.1.9,<3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "openapi-spec-validator>=0.9.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false
required-version = "==0.13.9"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["scripts"]  # operations scripts are outside the application lint scope

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # asserts and fake test credentials
# Long scenario tables and banners in the end-to-end web tests read better unwrapped.
"tests/auth/web/test_web_flow.py" = ["E501"]
"tests/auth/mobile/test_mobile_flow.py" = ["E501"]
"tests/auth/probe_routes.py" = ["E501"]
"tests/auth/context/*.py" = ["E501"]
"tests/auth/security/*.py" = ["E501"]
"tests/platform/*.py" = ["E501"]
"tests/identity/test_security_keycloak.py" = ["E501"]
"tests/identity/test_reconciliation_keycloak.py" = ["E501"]
"tests/identity/test_platform_grants_keycloak.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -m 'not keycloak'"
markers = ["keycloak: needs the disposable Keycloak container (identity CI job)"]
