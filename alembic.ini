[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# The database URL is never stored here: migrations/env.py builds it from the owner role
# settings, or uses a connection passed in programmatically (tests).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
