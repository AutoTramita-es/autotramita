# Run with -p autotramita-prod/dev and the corresponding --env-file.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--proxy-headers=xforwarded"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    networks: [internal, backend, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.autotramita-${ENVIRONMENT}-auth.rule=Host(`${AUTH_DOMAIN}`)
      - traefik.http.routers.autotramita-${ENVIRONMENT}-auth.entrypoints=websecure
      - traefik.http.routers.autotramita-${ENVIRONMENT}-auth.tls.certresolver=cloudflare
      - traefik.http.services.autotramita-${ENVIRONMENT}-auth.loadbalancer.server.port=8080

  api:
    image: ${API_IMAGE:-autotramita-api:pending}
    profiles: [application]
    restart: unless-stopped
    environment: &app-env
      ENVIRONMENT: ${ENVIRONMENT}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${APP_DB_NAME}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      NEXTCLOUD_URL: ${NEXTCLOUD_URL}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER}
      NEXTCLOUD_APP_PASSWORD: ${NEXTCLOUD_APP_PASSWORD}
      NEXTCLOUD_ROOT: ${NEXTCLOUD_ROOT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
    networks: [internal, backend, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.autotramita-${ENVIRONMENT}-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.autotramita-${ENVIRONMENT}-api.entrypoints=websecure
      - traefik.http.routers.autotramita-${ENVIRONMENT}-api.tls.certresolver=cloudflare
      - traefik.http.services.autotramita-${ENVIRONMENT}-api.loadbalancer.server.port=8000

  worker:
    image: ${API_IMAGE:-autotramita-api:pending}
    profiles: [application]
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    restart: unless-stopped
    environment: *app-env
    networks: [internal, backend]

  scheduler:
    image: ${API_IMAGE:-autotramita-api:pending}
    profiles: [application]
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info", "--schedule=/data/celerybeat-schedule"]
    restart: unless-stopped
    environment: *app-env
    volumes:
      - celery-beat-data:/data
    networks: [internal, backend]

  web:
    image: ${WEB_IMAGE:-autotramita-web:pending}
    profiles: [application]
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.autotramita-${ENVIRONMENT}-web.rule=Host(`${WEB_DOMAIN}`)
      - traefik.http.routers.autotramita-${ENVIRONMENT}-web.entrypoints=websecure
      - traefik.http.routers.autotramita-${ENVIRONMENT}-web.tls.certresolver=cloudflare
      - traefik.http.services.autotramita-${ENVIRONMENT}-web.loadbalancer.server.port=3000

volumes:
  redis-data:
  clamav-data:
  celery-beat-data:

networks:
  internal:
  backend:
    external: true
    name: backend
  proxy:
    external: true
    name: proxy
