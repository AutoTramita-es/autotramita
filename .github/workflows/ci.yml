name: CI

# Verification only: there is no deployment, no production secret and no privileged runner.
# Triggers use `pull_request` (never `pull_request_target`), so code from forks runs without
# secrets; the service credentials below are throwaway values that exist only inside the job.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 16, pinned by digest.
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_PASSWORD: ci-throwaway-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        # Redis 7, pinned by digest.
        image: redis:7@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      # Throwaway service containers of this job only; the tests create and drop their own
      # databases and roles. Missing variables fail the run instead of skipping tests.
      TEST_PG_ADMIN_URL: postgresql://postgres:ci-throwaway-password@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.9"
          python-version: "3.12.16"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Wait for PostgreSQL and Redis
        run: |
          uv run python - <<'PY'
          import os, sys, time
          import psycopg
          import redis

          deadline = time.monotonic() + 60
          pending = {"postgresql", "redis"}
          while pending and time.monotonic() < deadline:
              if "postgresql" in pending:
                  try:
                      with psycopg.connect(os.environ["TEST_PG_ADMIN_URL"], connect_timeout=3) as c:
                          c.execute("SELECT 1")
                      pending.discard("postgresql")
                  except psycopg.Error:
                      pass
              if "redis" in pending:
                  try:
                      redis.Redis.from_url(os.environ["TEST_REDIS_URL"], socket_timeout=3).ping()
                      pending.discard("redis")
                  except redis.RedisError:
                      pass
              time.sleep(1)
          if pending:
              sys.exit("Not ready: " + ", ".join(sorted(pending)))
          print("PostgreSQL and Redis answer.")
          PY
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: mypy
        run: uv run --locked mypy
      - name: Tests (real PostgreSQL 16 and Redis 7; RLS, API conventions, rate limiting)
        # Warnings are errors, except the one known upstream deprecation (R15): Starlette's
        # TestClient asks for httpx2. Any other warning fails the run instead of being hidden.
        run: >-
          uv run --locked pytest -q -ra --junitxml="$RUNNER_TEMP/junit.xml"
          -W error
          -W 'ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning'
      - name: Test counts (no skipped tests allowed)
        run: |
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "junit.xml")).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total, failed, errors, skipped = (
              int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")
          )
          passed = total - failed - errors - skipped
          line = f"tests={total} passed={passed} failed={failed} errors={errors} skipped={skipped}"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Test counts\n\n`{line}`\n")
          if skipped or failed or errors:
              sys.exit("Skipped, failed or errored tests are not allowed in CI.")
          PY
      - name: Owner migrations (upgrade head, downgrade base, upgrade again; role SQL twice)
        run: >-
          uv run --locked pytest -q
          tests/test_role_sql.py::test_upgrade_downgrade_upgrade_and_schema_contents
          tests/test_role_sql.py::test_role_sql_is_idempotent
          tests/test_roles_and_migrations.py::test_baseline_up_and_down
          tests/test_role_sql.py::test_migrations_refuse_non_owner_roles
      - name: Rate-limit timing regression (3 repeated runs, no assertion loosened)
        run: |
          for run in 1 2 3; do
            uv run --locked pytest -q tests/test_ratelimit.py -W error \
              -W 'ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning'
          done
      - name: OpenAPI specification is valid OpenAPI 3.1 (independent of the generators)
        run: uv run --locked openapi-spec-validator openapi/openapi.json
      - name: OpenAPI contract is current
        run: uv run --locked python -m app.api.export_openapi --check
      - name: TypeScript and Dart clients can be generated
        run: ./openapi/check-clients.sh

  identity:
    name: Keycloak 26.4.7 integration (disposable container)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 16, pinned by digest (the web sign-in tests need a real database).
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_PASSWORD: ci-throwaway-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        # Redis 7, pinned by digest.
        image: redis:7@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      TEST_PG_ADMIN_URL: postgresql://postgres:ci-throwaway-password@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/14
      # Throwaway values that exist only inside this job; the realm file holds no secret.
      TEST_KEYCLOAK_URL: http://127.0.0.1:18081
      TEST_KEYCLOAK_ADMIN_USER: ci-admin
      TEST_KEYCLOAK_ADMIN_PASSWORD: ci-throwaway-admin-password
      AT_WEB_CLIENT_SECRET: ci-throwaway-web-client-secret
      AT_ADMIN_SVC_CLIENT_SECRET: ci-throwaway-svc-client-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.9"
          python-version: "3.12.16"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Start Keycloak (pinned by digest, in-memory, test realm only)
        run: >-
          docker run -d --name keycloak --network host
          -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN_USER"
          -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD"
          -e AT_WEB_CLIENT_SECRET -e AT_ADMIN_SVC_CLIENT_SECRET
          -v "$PWD/identity/keycloak/realm-test.json:/opt/keycloak/data/import/realm-test.json:ro"
          -v "$PWD/identity/keycloak/blacklists:/opt/keycloak/data/password-blacklists:ro"
          quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
          start-dev --import-realm --http-host=127.0.0.1 --http-port=18081 --hostname-strict=false
      - name: Wait for the imported realm
        run: |
          for attempt in $(seq 1 90); do
            if curl -sf "$TEST_KEYCLOAK_URL/realms/autotramita-test/.well-known/openid-configuration" > /dev/null; then
              echo "realm ready after ${attempt} attempts"; exit 0
            fi
            sleep 2
          done
          docker logs keycloak | tail -80
          echo "Keycloak did not become ready" >&2
          exit 1
      - name: Keycloak spike and OIDC tests (no skipped tests allowed)
        run: |
          export SPIKE_RESULTS_PATH="$RUNNER_TEMP/spike-results.json"
          uv run --locked pytest -q -ra -m keycloak tests/identity --junitxml="$RUNNER_TEMP/junit-identity.xml" -W error -W 'ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning'
      - name: Import DEV and PROD realms into isolated Keycloak instances
        run: |
          set -eu
          for kind in dev prod; do
            container="keycloak-import-${kind}"
            trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
            docker run -d --name "$container" --network host \
              -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN_USER" \
              -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD" \
              -e AT_WEB_CLIENT_SECRET -e AT_ADMIN_SVC_CLIENT_SECRET \
              -v "$PWD/identity/keycloak/realm-${kind}.json:/opt/keycloak/data/import/realm.json:ro" \
              -v "$PWD/identity/keycloak/blacklists:/opt/keycloak/data/password-blacklists:ro" \
              quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007 \
              start-dev --import-realm --http-host=127.0.0.1 --http-port=18082 --hostname-strict=false
            ready=0
            for attempt in $(seq 1 90); do
              if curl -sf http://127.0.0.1:18082/realms/master/.well-known/openid-configuration > /dev/null; then
                ready=1; break
              fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then docker logs "$container" | tail -80; exit 1; fi
            REALM_KIND="$kind" uv run --locked python - <<'PYREALM'
          import os
          import httpx

          base = "http://127.0.0.1:18082"
          realm = "autotramita-" + os.environ["REALM_KIND"]
          token = httpx.post(base + "/realms/master/protocol/openid-connect/token", data={
              "grant_type": "password", "client_id": "admin-cli",
              "username": os.environ["TEST_KEYCLOAK_ADMIN_USER"],
              "password": os.environ["TEST_KEYCLOAK_ADMIN_PASSWORD"],
          })
          token.raise_for_status()
          headers = {"Authorization": "Bearer " + token.json()["access_token"]}
          response = httpx.get(base + "/admin/realms/" + realm, headers=headers)
          response.raise_for_status()
          assert response.json()["realm"] == realm
          profile = httpx.get(base + "/admin/realms/" + realm + "/users/profile", headers=headers)
          profile.raise_for_status()
          attrs = {a["name"]: a for a in profile.json()["attributes"]}
          assert "required" not in attrs["firstName"] and "required" not in attrs["lastName"]
          actions = httpx.get(base + "/admin/realms/" + realm + "/authentication/required-actions",
                              headers=headers)
          actions.raise_for_status()
          enabled = {a["alias"]: a["enabled"] for a in actions.json()}
          assert enabled["webauthn-register"] is False
          assert enabled["webauthn-register-passwordless"] is False
          assert enabled["CONFIGURE_TOTP"] is True and enabled["UPDATE_PASSWORD"] is True
          imported = response.json()
          assert imported["browserFlow"] == "browser-loa"
          assert imported["directGrantFlow"] == "direct-grant-denied"
          executions = httpx.get(
              base + "/admin/realms/" + realm + "/authentication/flows/browser-loa/executions",
              headers=headers)
          executions.raise_for_status()
          found = {(e.get("providerId"), e["requirement"]) for e in executions.json()}
          for factor in ("auth-otp-form", "webauthn-authenticator",
                         "webauthn-authenticator-passwordless", "auth-recovery-authn-code-form"):
              assert (factor, "ALTERNATIVE") in found, factor
          assert ("conditional-sub-flow-executed", "REQUIRED") in found
          for client in ("at-web", "at-mobile"):
              result = httpx.get(base + "/admin/realms/" + realm + "/clients",
                                 params={"clientId": client}, headers=headers)
              result.raise_for_status()
              rows = [c for c in result.json() if c["clientId"] == client]
              assert len(rows) == 1 and rows[0]["fullScopeAllowed"] is False
              assert "at-loa-times" in {m["name"] for m in rows[0]["protocolMappers"]}
          print(realm + " imported and verified")
          PYREALM
            docker rm -f "$container" >/dev/null
            trap - EXIT
          done
      - name: Spike observations
        if: always()
        run: cat "$RUNNER_TEMP/spike-results.json" || true
      - name: Test counts (no skipped tests allowed)
        run: |
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "junit-identity.xml")).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total, failed, errors, skipped = (
              int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")
          )
          line = f"tests={total} failed={failed} errors={errors} skipped={skipped}"
          print(line)
          if total < 10 or skipped or failed or errors:
              sys.exit("Keycloak job needs all tests to run and pass.")
          PY
      - name: Keycloak log on failure
        if: failure()
        run: docker logs keycloak | tail -150

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks v8.21.2 (full history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --source /repo --redact --no-banner --exit-code 1

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.9"
          python-version: "3.12.16"
      - name: pip-audit 2.10.1 against the locked dependency set
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict
