name: CI

# Verification only: there is no deployment, no production secret and no privileged runner.
# Triggers use `pull_request` (never `pull_request_target`), so code from forks runs without
# secrets; the service credentials below are throwaway values that exist only inside the job.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 16, pinned by digest.
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_PASSWORD: ci-throwaway-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        # Redis 7, pinned by digest.
        image: redis:7@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      # Throwaway service containers of this job only; the tests create and drop their own
      # databases and roles. Missing variables fail the run instead of skipping tests.
      TEST_PG_ADMIN_URL: postgresql://postgres:ci-throwaway-password@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      # pytest-xdist processes of the main suite (INFRA-CI-02): "auto" is one per CPU, at most 12
      # (scripts/ci/pytest_phases.py); "1" runs the suite serially in one process.
      PYTEST_WORKERS: "auto"
      # Workers share no state: gw0 uses the services above, gwN the PostgreSQL server on port
      # 5440+N and logical database N of a second Redis.
      TEST_PG_WORKER_PORT_BASE: "5440"
      TEST_REDIS_WORKERS_URL: redis://127.0.0.1:6440/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.9"
          python-version: "3.12.16"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Wait for PostgreSQL and Redis
        run: |
          uv run python - <<'PY'
          import os, sys, time
          import psycopg
          import redis

          deadline = time.monotonic() + 60
          pending = {"postgresql", "redis"}
          while pending and time.monotonic() < deadline:
              if "postgresql" in pending:
                  try:
                      with psycopg.connect(os.environ["TEST_PG_ADMIN_URL"], connect_timeout=3) as c:
                          c.execute("SELECT 1")
                      pending.discard("postgresql")
                  except psycopg.Error:
                      pass
              if "redis" in pending:
                  try:
                      redis.Redis.from_url(os.environ["TEST_REDIS_URL"], socket_timeout=3).ping()
                      pending.discard("redis")
                  except redis.RedisError:
                      pass
              time.sleep(1)
          if pending:
              sys.exit("Not ready: " + ", ".join(sorted(pending)))
          print("PostgreSQL and Redis answer.")
          PY
      - name: Start the servers of the additional test workers
        # Roles are global to a PostgreSQL server and migrations inspect all of them, so workers
        # sharing one would see each other's roles appear and vanish: one server each. Same images
        # as the services, loopback only, throwaway data; the servers vanish with the job.
        run: |
          set -eu
          workers="$(uv run --locked python scripts/ci/pytest_phases.py --workers "$PYTEST_WORKERS" --print-workers)"
          echo "test workers: $workers"
          if [ "$workers" -le 1 ]; then exit 0; fi
          docker run -d --name redis-workers --network host \
            redis:7@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738 \
            redis-server --bind 127.0.0.1 --port 6440 --databases 64 --save ""
          for worker in $(seq 1 $((workers - 1))); do
            # The data lives in the job's temporary directory (memory-backed in Local CI) and
            # the server runs as the unprivileged user that owns it.
            data="$RUNNER_TEMP/postgres-worker$worker"
            mkdir -p "$data"
            docker run -d --name "postgres-worker$worker" --network host --user 1001:1001 \
              -v "$data:/var/lib/postgresql/data" \
              -e POSTGRES_PASSWORD=ci-throwaway-password -e POSTGRES_INITDB_ARGS=--no-sync \
              -e PGPORT=$((TEST_PG_WORKER_PORT_BASE + worker)) \
              postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8 \
              -c listen_addresses=127.0.0.1 -c fsync=off
          done
          WORKERS="$workers" uv run --locked python - <<'PY'
          import os, sys, time
          import psycopg
          import redis

          deadline = time.monotonic() + 90
          base = int(os.environ["TEST_PG_WORKER_PORT_BASE"])
          pending = {base + n for n in range(1, int(os.environ["WORKERS"]))}
          cache = redis.Redis.from_url(os.environ["TEST_REDIS_WORKERS_URL"], socket_timeout=3)
          cache_ready = False
          while (pending or not cache_ready) and time.monotonic() < deadline:
              try:
                  cache_ready = bool(cache.ping())
              except redis.RedisError:
                  pass
              for port in sorted(pending):
                  try:
                      with psycopg.connect(os.environ["TEST_PG_ADMIN_URL"], port=port,
                                           connect_timeout=3) as c:
                          c.execute("SELECT 1")
                      pending.discard(port)
                  except psycopg.Error:
                      pass
              time.sleep(0.5)
          if pending:
              sys.exit("PostgreSQL not ready on ports " + ", ".join(map(str, sorted(pending))))
          if not cache_ready:
              sys.exit("The Redis of the additional workers is not ready.")
          print("Every test worker has its PostgreSQL server and Redis database.")
          PY
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: mypy
        run: uv run --locked mypy
      - name: Tests (real PostgreSQL 16 and Redis 7; RLS, API conventions, rate limiting)
        # Warnings are errors, except the one known upstream deprecation (R15): Starlette's
        # TestClient asks for httpx2. Any other warning fails the run instead of being hidden.
        # The script runs this pytest command in two parts (INFRA-CI-02): parallel workers, then
        # the tests of tests/serial_tests.py alone; one JUnit file holds both.
        run: >-
          uv run --locked python scripts/ci/pytest_phases.py --workers "$PYTEST_WORKERS" --
          pytest -q -ra --junitxml="$RUNNER_TEMP/junit.xml"
          -W error
          -W 'ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning'
      - name: Test counts (no skipped tests allowed)
        run: |
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "junit.xml")).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total, failed, errors, skipped = (
              int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")
          )
          passed = total - failed - errors - skipped
          line = f"tests={total} passed={passed} failed={failed} errors={errors} skipped={skipped}"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Test counts\n\n`{line}`\n")
          if skipped or failed or errors:
              sys.exit("Skipped, failed or errored tests are not allowed in CI.")
          PY
      - name: Owner migrations (upgrade head, downgrade base, upgrade again; role SQL twice)
        run: >-
          uv run --locked pytest -q
          tests/test_role_sql.py::test_upgrade_downgrade_upgrade_and_schema_contents
          tests/test_role_sql.py::test_role_sql_is_idempotent
          tests/test_roles_and_migrations.py::test_baseline_up_and_down
          tests/test_role_sql.py::test_migrations_refuse_non_owner_roles
      - name: Rate-limit timing regression (3 repeated runs, no assertion loosened)
        run: |
          for run in 1 2 3; do
            uv run --locked pytest -q tests/test_ratelimit.py -W error \
              -W 'ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning'
          done
      - name: OpenAPI specification is valid OpenAPI 3.1 (independent of the generators)
        run: uv run --locked openapi-spec-validator openapi/openapi.json
      - name: OpenAPI contract is current
        run: uv run --locked python -m app.api.export_openapi --check
      - name: TypeScript and Dart clients can be generated
        run: ./openapi/check-clients.sh

  identity:
    name: Keycloak 26.8.2 integration (disposable container)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 16, pinned by digest (the web sign-in tests need a real database).
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_PASSWORD: ci-throwaway-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        # Redis 7, pinned by digest.
        image: redis:7@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      TEST_PG_ADMIN_URL: postgresql://postgres:ci-throwaway-password@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/14
      # Throwaway values that exist only inside this job; the realm file holds no secret.
      TEST_KEYCLOAK_URL: http://127.0.0.1:18081
      # Two more nodes on one PostgreSQL database: the provider's lock across instances.
      TEST_KEYCLOAK_NODE_URLS: http://127.0.0.1:18083 http://127.0.0.1:18084
      # Parallel test shards (INFRA-CI-02), each against an instance with a realm of its own:
      # "auto" is three shards on a host with 16 or more CPUs, otherwise two; "1" is one process.
      KEYCLOAK_SHARDS: "auto"
      TEST_KEYCLOAK_SHARD_URLS: http://127.0.0.1:18086 http://127.0.0.1:18088
      TEST_KEYCLOAK_ADMIN_USER: ci-admin
      TEST_KEYCLOAK_ADMIN_PASSWORD: ci-throwaway-admin-password
      AT_WEB_CLIENT_SECRET: ci-throwaway-web-client-secret
      AT_ADMIN_SVC_CLIENT_SECRET: ci-throwaway-svc-client-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.9"
          python-version: "3.12.16"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Build the AutoTramita Keycloak image (pinned upstream, provider from source)
        run: >-
          docker build
          --build-arg KEYCLOAK_IMAGE=quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
          --build-arg JDK_IMAGE=eclipse-temurin:21-jdk@sha256:8ad118b146aa92da815b576441acd6b42b38236797ad0b6edc8c200b85bb0734
          --tag autotramita-keycloak:ci
          "$PWD/identity/keycloak"
      - name: Start Keycloak (pinned by digest, in-memory, test realm only)
        run: >-
          docker run -d --name keycloak --network host
          -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN_USER"
          -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD"
          -e AT_WEB_CLIENT_SECRET -e AT_ADMIN_SVC_CLIENT_SECRET
          -v "$PWD/identity/keycloak/realm-test.json:/opt/keycloak/data/import/realm-test.json:ro"
          -v "$PWD/identity/keycloak/blacklists:/opt/keycloak/data/password-blacklists:ro"
          autotramita-keycloak:ci
          start-dev --import-realm --http-host=127.0.0.1 --http-port=18081 --hostname-strict=false
      - name: Start the Keycloak instances of the additional test shards (own realm and sinks)
        run: |
          set -eu
          shards="$(uv run --locked python scripts/ci/keycloak_shards.py --shards "$KEYCLOAK_SHARDS" --print-shards)"
          echo "test shards: $shards"
          shard=0
          for url in $TEST_KEYCLOAK_SHARD_URLS; do
            shard=$((shard + 1))
            if [ "$shard" -ge "$shards" ]; then break; fi
            smtp=$((18025 + shard)); backchannel=$((18090 + shard))
            realm="$RUNNER_TEMP/realm-shard$shard.json"
            sed -e "s/\"port\": \"18025\"/\"port\": \"$smtp\"/" \
              -e "s#127\.0\.0\.1:18090/#127.0.0.1:$backchannel/#g" \
              identity/keycloak/realm-test.json > "$realm"
            grep -q "\"port\": \"$smtp\"" "$realm"
            grep -q "127\.0\.0\.1:$backchannel/" "$realm"
            if grep -Eq '"port": "18025"|127\.0\.0\.1:18090/' "$realm"; then exit 1; fi
            docker run -d --name "keycloak-shard$shard" --network host \
              -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN_USER" \
              -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD" \
              -e AT_WEB_CLIENT_SECRET -e AT_ADMIN_SVC_CLIENT_SECRET \
              -v "$realm:/opt/keycloak/data/import/realm-test.json:ro" \
              -v "$PWD/identity/keycloak/blacklists:/opt/keycloak/data/password-blacklists:ro" \
              autotramita-keycloak:ci \
              start-dev --import-realm --http-host=127.0.0.1 --http-port="${url##*:}" --hostname-strict=false
          done
      - name: Start two Keycloak nodes on one PostgreSQL database
        run: |
          set -eu
          uv run --locked python -c "import os, psycopg; c = psycopg.connect(os.environ['TEST_PG_ADMIN_URL'], autocommit=True); c.execute('CREATE DATABASE keycloak_nodes'); c.close()"
          for node in 1 2; do
            port=$((18082 + node))
            import=""
            if [ "$node" = 1 ]; then import="--import-realm"; fi
            docker run -d --name "keycloak-node$node" --network host \
              -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN_USER" \
              -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD" \
              -e AT_WEB_CLIENT_SECRET -e AT_ADMIN_SVC_CLIENT_SECRET \
              -v "$PWD/identity/keycloak/realm-test.json:/opt/keycloak/data/import/realm-test.json:ro" \
              -v "$PWD/identity/keycloak/blacklists:/opt/keycloak/data/password-blacklists:ro" \
              autotramita-keycloak:ci \
              start-dev $import --http-host=127.0.0.1 --http-port="$port" --hostname-strict=false \
              --db=postgres --db-url=jdbc:postgresql://127.0.0.1:5432/keycloak_nodes \
              --db-username=postgres --db-password=ci-throwaway-password
            ready=0
            for attempt in $(seq 1 120); do
              if curl -sf "http://127.0.0.1:$port/realms/autotramita-test/.well-known/openid-configuration" > /dev/null; then
                ready=1; break
              fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then docker logs "keycloak-node$node" | tail -80; exit 1; fi
            echo "node $node ready"
          done
      - name: Wait for the imported realm
        run: |
          shards="$(uv run --locked python scripts/ci/keycloak_shards.py --shards "$KEYCLOAK_SHARDS" --print-shards)"
          urls="$TEST_KEYCLOAK_URL"
          shard=0
          for url in $TEST_KEYCLOAK_SHARD_URLS; do
            shard=$((shard + 1))
            if [ "$shard" -ge "$shards" ]; then break; fi
            urls="$urls $url"
          done
          for url in $urls; do
            ready=0
            for attempt in $(seq 1 90); do
              if curl -sf "$url/realms/autotramita-test/.well-known/openid-configuration" > /dev/null; then
                ready=1; echo "realm at $url ready after ${attempt} attempts"; break
              fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then
              docker logs keycloak | tail -80
              docker logs keycloak-shard1 | tail -80 || true
              echo "Keycloak at $url did not become ready" >&2
              exit 1
            fi
          done
      - name: Keycloak spike and OIDC tests (no skipped tests allowed)
        run: |
          export SPIKE_RESULTS_PATH="$RUNNER_TEMP/spike-results.json"
          # Shards at the same time, one Keycloak instance each (INFRA-CI-02).
          uv run --locked python scripts/ci/keycloak_shards.py --shards "$KEYCLOAK_SHARDS" -- pytest -q -ra -m keycloak tests/identity --junitxml="$RUNNER_TEMP/junit-identity.xml" -W error -W 'ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning'
      # The test shards and the nodes are done. DEV, PROD and the providerless instance start
      # together (INFRA-CI-02) and are verified one after the other, each by the same checks.
      - name: Start the isolated DEV and PROD import instances
        run: |
          set -eu
          shards="$(uv run --locked python scripts/ci/keycloak_shards.py --shards "$KEYCLOAK_SHARDS" --print-shards)"
          for container in $(seq -f 'keycloak-shard%g' 1 $((shards - 1))) keycloak-node1 keycloak-node2; do
            docker rm -f "$container" > /dev/null
          done
          for kind in dev prod; do
            if [ "$kind" = dev ]; then port=18082; else port=18087; fi
            docker run -d --name "keycloak-import-${kind}" --network host \
              -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN_USER" \
              -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD" \
              -e AT_WEB_CLIENT_SECRET -e AT_ADMIN_SVC_CLIENT_SECRET \
              -v "$PWD/identity/keycloak/realm-${kind}.json:/opt/keycloak/data/import/realm.json:ro" \
              -v "$PWD/identity/keycloak/blacklists:/opt/keycloak/data/password-blacklists:ro" \
              autotramita-keycloak:ci \
              start-dev --import-realm --http-host=127.0.0.1 --http-port="$port" --hostname-strict=false
          done
      - name: "Without the security provider: start an upstream instance"
        run: >-
          docker run -d --name keycloak-without-provider --network host
          -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN_USER"
          -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD"
          -e AT_WEB_CLIENT_SECRET -e AT_ADMIN_SVC_CLIENT_SECRET
          -v "$PWD/identity/keycloak/realm-test.json:/opt/keycloak/data/import/realm-test.json:ro"
          -v "$PWD/identity/keycloak/blacklists:/opt/keycloak/data/password-blacklists:ro"
          quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
          start-dev --import-realm --http-host=127.0.0.1 --http-port=18085 --hostname-strict=false
      - name: Import DEV and PROD realms into isolated Keycloak instances
        run: |
          set -eu
          for kind in dev prod; do
            if [ "$kind" = dev ]; then port=18082; else port=18087; fi
            container="keycloak-import-${kind}"
            trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
            ready=0
            for attempt in $(seq 1 90); do
              if curl -sf "http://127.0.0.1:$port/realms/master/.well-known/openid-configuration" > /dev/null; then
                ready=1; break
              fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then docker logs "$container" | tail -80; exit 1; fi
            REALM_KIND="$kind" REALM_PORT="$port" uv run --locked python - <<'PYREALM'
          import os
          import httpx

          base = "http://127.0.0.1:" + os.environ["REALM_PORT"]
          realm = "autotramita-" + os.environ["REALM_KIND"]
          token = httpx.post(base + "/realms/master/protocol/openid-connect/token", data={
              "grant_type": "password", "client_id": "admin-cli",
              "username": os.environ["TEST_KEYCLOAK_ADMIN_USER"],
              "password": os.environ["TEST_KEYCLOAK_ADMIN_PASSWORD"],
          })
          token.raise_for_status()
          headers = {"Authorization": "Bearer " + token.json()["access_token"]}
          response = httpx.get(base + "/admin/realms/" + realm, headers=headers)
          response.raise_for_status()
          assert response.json()["realm"] == realm
          profile = httpx.get(base + "/admin/realms/" + realm + "/users/profile", headers=headers)
          profile.raise_for_status()
          attrs = {a["name"]: a for a in profile.json()["attributes"]}
          assert "required" not in attrs["firstName"] and "required" not in attrs["lastName"]
          assert attrs["at_mfa_required"]["permissions"] == {"view": ["admin"], "edit": ["admin"]}
          assert attrs["at_mfa_mandatory"]["permissions"] == {"view": ["admin"], "edit": ["admin"]}
          actions = httpx.get(base + "/admin/realms/" + realm + "/authentication/required-actions",
                              headers=headers)
          actions.raise_for_status()
          enabled = {a["alias"]: a["enabled"] for a in actions.json()}
          assert enabled["webauthn-register"] is False
          assert enabled["webauthn-register-passwordless"] is False
          assert enabled["CONFIGURE_TOTP"] is True and enabled["UPDATE_PASSWORD"] is True
          assert enabled["delete_credential"] is False
          assert enabled["CONFIGURE_RECOVERY_AUTHN_CODES"] is True
          assert enabled["at-disable-mfa"] is True
          info = httpx.get(base + "/admin/serverinfo", headers=headers)
          info.raise_for_status()
          providers = info.json()["providers"]
          guarded = providers["required-action"]["providers"]
          for action in ("CONFIGURE_TOTP", "CONFIGURE_RECOVERY_AUTHN_CODES", "UPDATE_PASSWORD",
                         "webauthn-register", "webauthn-register-passwordless", "at-disable-mfa"):
              assert guarded[action]["operationalInfo"]["autotramita-guard"] == "1.2.0", action
          assert "at-security-guard" in providers["authenticator"]["providers"]
          password = httpx.get(base + "/admin/realms/" + realm
                               + "/authentication/required-actions/UPDATE_PASSWORD/config",
                               headers=headers)
          password.raise_for_status()
          assert password.json()["config"] == {"max_auth_age": "0"}
          imported = response.json()
          assert imported["browserFlow"] == "browser-loa"
          assert imported["directGrantFlow"] == "direct-grant-denied"
          executions = httpx.get(
              base + "/admin/realms/" + realm + "/authentication/flows/browser-loa/executions",
              headers=headers)
          executions.raise_for_status()
          found = {(e.get("providerId"), e["requirement"]) for e in executions.json()}
          for factor in ("auth-otp-form", "webauthn-authenticator",
                         "webauthn-authenticator-passwordless", "auth-recovery-authn-code-form"):
              assert (factor, "ALTERNATIVE") in found, factor
          assert ("conditional-sub-flow-executed", "REQUIRED") in found
          assert ("at-security-guard", "REQUIRED") in found
          for step in ("conditional-credential", "conditional-user-attribute",
                       "deny-access-authenticator", "user-session-limits"):
              assert (step, "REQUIRED") in found, step
          assert ("auth-recovery-authn-code-form", "DISABLED") in found
          for client in ("at-web", "at-mobile"):
              result = httpx.get(base + "/admin/realms/" + realm + "/clients",
                                 params={"clientId": client}, headers=headers)
              result.raise_for_status()
              rows = [c for c in result.json() if c["clientId"] == client]
              assert len(rows) == 1 and rows[0]["fullScopeAllowed"] is False
              assert "at-loa-times" in {m["name"] for m in rows[0]["protocolMappers"]}
          print(realm + " imported and verified")
          PYREALM
            docker rm -f "$container" >/dev/null
            trap - EXIT
          done
      - name: Without the security provider the realm signs nobody in
        run: |
          set -eu
          ready=0
          for attempt in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18085/realms/master/.well-known/openid-configuration > /dev/null; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker logs keycloak-without-provider | tail -80; exit 1; fi
          sleep 5
          TEST_KEYCLOAK_URL=http://127.0.0.1:18085 uv run --locked python - <<'PYGUARD'
          from tests.identity.kc import Admin, Browser, Env
          import httpx, os

          env = Env(os.environ["TEST_KEYCLOAK_URL"], os.environ["TEST_KEYCLOAK_ADMIN_USER"],
                    os.environ["TEST_KEYCLOAK_ADMIN_PASSWORD"], os.environ["AT_WEB_CLIENT_SECRET"],
                    os.environ["AT_ADMIN_SVC_CLIENT_SECRET"])
          admin = Admin(env)
          realm = admin.master("GET", "")
          if realm.status_code == 404:
              print("the realm was not imported without the provider: nobody can sign in")
          else:
              realm.raise_for_status()
              user = admin.create_user()
              browser = Browser(env)
              page = browser.authorize("at-web", "http://127.0.0.1:18080/api/v1/auth/callback")
              assert page.code is None, "a sign-in succeeded without the security provider"
              if 'name="password"' in page.text:
                  page = browser.submit(
                      page, {"username": user.email, "password": user.password, "credentialId": ""}
                  )
                  assert page.code is None, "a sign-in succeeded without the security provider"
              assert 'name="password"' not in page.text or "Invalid" in page.text, page.summary
              print("sign-in refused without the provider:", page.status, page.summary[:80])
          PYGUARD
          docker rm -f keycloak-without-provider > /dev/null
      - name: Spike observations
        if: always()
        run: cat "$RUNNER_TEMP/spike-results.json" || true
      - name: Test counts (no skipped tests allowed)
        run: |
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "junit-identity.xml")).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total, failed, errors, skipped = (
              int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")
          )
          line = f"tests={total} failed={failed} errors={errors} skipped={skipped}"
          print(line)
          if total < 10 or skipped or failed or errors:
              sys.exit("Keycloak job needs all tests to run and pass.")
          PY
      - name: Keycloak log on failure
        if: failure()
        run: |
          docker logs keycloak | tail -150
          docker logs keycloak-shard1 2>/dev/null | tail -150 || true
          docker logs keycloak-shard2 2>/dev/null | tail -150 || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks v8.21.2 (full history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          detect --source /repo --redact --no-banner --exit-code 1

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.9"
          python-version: "3.12.16"
      - name: pip-audit 2.10.1 against the locked dependency set
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict

  image-scan:
    # KC-SP-12: the image Keycloak runs from, scanned for operating-system and Java
    # vulnerabilities. The databases are downloaded by the pinned scanner, the scan itself runs
    # without network, and the gate refuses an old database and every unaccepted CRITICAL or HIGH.
    name: Keycloak image vulnerability scan (Trivy, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the AutoTramita Keycloak image (pinned upstream, provider from source)
        run: >-
          docker build
          --build-arg KEYCLOAK_IMAGE=quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
          --build-arg JDK_IMAGE=eclipse-temurin:21-jdk@sha256:8ad118b146aa92da815b576441acd6b42b38236797ad0b6edc8c200b85bb0734
          --tag autotramita-keycloak:ci
          "$PWD/identity/keycloak"
      - name: Download the Trivy vulnerability databases (pinned scanner, network)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/trivy"
          for database in --download-db-only --download-java-db-only; do
            docker run --rm --user 1001:1001 -e HOME=/cache -v "$RUNNER_TEMP/trivy:/cache" \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              --cache-dir /cache image "$database" --no-progress
          done
      - name: Save the image for the scanner
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/scan/report"
          docker save --output "$RUNNER_TEMP/scan/keycloak-image.tar" autotramita-keycloak:ci
      - name: Scan the image offline (operating system and Java)
        run: >-
          docker run --rm --network none --user 1001:1001 -e HOME=/cache
          -v "$RUNNER_TEMP/trivy:/cache"
          -v "$RUNNER_TEMP/scan/keycloak-image.tar:/image.tar:ro"
          -v "$RUNNER_TEMP/scan/report:/report"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          --cache-dir /cache image --input /image.tar --skip-db-update --skip-java-db-update
          --offline-scan --scanners vuln --format json --output /report/keycloak.json --no-progress
      - name: CRITICAL and HIGH findings need an owner decision (scan gate)
        run: >-
          python3 scripts/identity/scan_gate.py
          --report "$RUNNER_TEMP/scan/report/keycloak.json"
          --cache "$RUNNER_TEMP/trivy"
          --acceptances identity/keycloak/vulnerability-acceptances.json
          --image autotramita-keycloak:ci
          --summary "$RUNNER_TEMP/scan/report/summary.json"
